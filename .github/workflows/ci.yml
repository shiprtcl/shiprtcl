name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Conformance vectors are up to date
        run: npm run vectors && git diff --exit-code conformance/
      - name: Vectors verify with an independent SHA-256
        working-directory: conformance
        run: python3 -c 'import json,hashlib,sys; d=json.load(open("fingerprint-vectors.json")); sys.exit(0 if all("sr1:sha256:"+hashlib.sha256(v["canonical"].encode()).hexdigest()==v["fingerprint"] for v in d["vectors"]) else 1)'
